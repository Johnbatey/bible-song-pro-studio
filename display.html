<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://localhost:* http://127.0.0.1:*; media-src 'self' blob: http://localhost:* http://127.0.0.1:*; connect-src 'self' ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*; font-src 'self' data: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; frame-src 'self' http://localhost:* http://127.0.0.1:*;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Song Pro — Display</title>
<style>
/* Voice — the brand face scripture is set in. Variable, so one file
   covers every weight the themes ask for. */
@font-face{font-family:"Source Serif 4";src:url(fonts/SourceSerif4-latin-var.woff2) format("woff2");font-weight:200 900;font-display:swap}
/* The presentation faces the operator picks from. Eight of these were a
   Regular/Bold pair pointing at files that were GitHub 404 pages, so those
   families silently fell back to a system font on air. They are variable now —
   one file, one weight range per family, matching src/shared/display-fonts.ts.
   Keep the two in step: this file serves the browser/network output and that
   one the bundled windows, and a face in one but not the other is an operator
   picking a font the other surface substitutes. */
@font-face{font-family:Poppins;src:url(fonts/Poppins-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:Poppins;src:url(fonts/Poppins-Medium.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:Poppins;src:url(fonts/Poppins-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Bebas Neue";src:url(fonts/BebasNeue-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/InterVariable.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Montserrat;src:url(fonts/Montserrat-Variable.ttf) format("truetype");font-weight:100 900;font-display:swap}
@font-face{font-family:Roboto;src:url(fonts/Roboto-Variable.ttf) format("truetype");font-weight:100 900;font-display:swap}
@font-face{font-family:Oswald;src:url(fonts/Oswald-Variable.ttf) format("truetype");font-weight:200 700;font-display:swap}
@font-face{font-family:"Crimson Pro";src:url(fonts/CrimsonPro-Variable.ttf) format("truetype");font-weight:200 900;font-display:swap}
@font-face{font-family:"Playfair Display";src:url(fonts/PlayfairDisplay-Variable.ttf) format("truetype");font-weight:400 900;font-display:swap}
@font-face{font-family:Lora;src:url(fonts/Lora-Variable.ttf) format("truetype");font-weight:400 700;font-display:swap}
@font-face{font-family:Cinzel;src:url(fonts/Cinzel-Variable.ttf) format("truetype");font-weight:400 900;font-display:swap}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body, #root { width: 100%; height: 100%; background: transparent; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; background: transparent; }

/* ── App Container ── */
.app-container { height: 100vh; width: 100vw; background: transparent; overflow: hidden; }
.app {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1920px;
  height: 1080px;
  transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
  transform-origin: center center;
  overflow: hidden;
  background: transparent;
}
.app.app-fs { background: #000; }
.app-bg-layer { position: absolute; inset: 0; pointer-events: none; background-size: cover; background-position: center; background-repeat: no-repeat; transform: translateZ(0); }
.app-bg-previous { animation: backgroundFadeOut .5s ease forwards; }
.app-bg-video { width: 100%; height: 100%; object-fit: cover; }

/* ── Verse Display — same 1920×1080 box as ProgramSurface ── */
.verse-display { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; padding: 32px 72px; box-sizing: border-box; overflow: hidden; z-index: 2; }
.verse-display.hidden { opacity: 0; pointer-events: none; }
.verse-display.fading-in, .verse-display.visible { opacity: 1; }
.verse-display.fading-out { opacity: 0; transition: opacity .35s ease; }
.verse-container { width: 100%; max-width: 1740px; background: transparent; padding: 0; box-sizing: border-box; }
.verse-reference { font-family: inherit; }
.verse-reference-row { display: flex; align-items: baseline; justify-content: center; gap: .75rem; margin-bottom: 1.4rem; width: 100%; }
.verse-reference-translation { font-family: inherit; font-weight: 700; }
.verse-text { font-family: inherit; white-space: pre-line; width: 100%; line-height: 1.24; }

/* ── Compare / Dual-Translation ── */
.compare-layout { display: flex; align-items: stretch; justify-content: center; gap: 2.5rem; width: 100%; }
.compare-pane { flex: 1 1 0; min-width: 0; }
.compare-divider { width: 1px; background: rgba(255,255,255,.18); }

/* ── Lyrics ── */
.lyrics-text-block { display: flex; flex-direction: column; gap: 0; }
.lyrics-line { white-space: pre; }

/* ── Theme Backgrounds ── */
.theme-none { background: #000; }
.theme-transparent { background: transparent !important; }
.theme-green-screen { background: #0f0 !important; }
.theme-nature { background: linear-gradient(180deg, #1a3a2a, #0d1f14, #050d08); }
.theme-abstract { background: linear-gradient(135deg, #1a0533, #0d1b3e, #1a0533); }
.theme-minimal { background: linear-gradient(180deg, #1a1a1e, #0d0d10, #000); }
.theme-space { background: linear-gradient(180deg, #050a1a, #0a1630, #050a1a); }
.theme-church { background: linear-gradient(180deg, #1a0f05, #2a1a0a, #1a0f05); }
.theme-custom-image { background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #000; }

/* ── Song Credit (CCLI) ── */
/* Kept legible on purpose — a CCLI credit that cannot be read does not satisfy the licence */
.song-credit { margin-top: 1.75rem; font-size: clamp(11px, 1vw, 17px); opacity: .72; letter-spacing: .02em; text-align: center; line-height: 1.5; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.lower-third .song-credit { margin-top: .5rem; text-align: left; font-size: clamp(9px, .7vw, 13px); }

/* ── Lower Third: box pinned to the bottom of the 1080p stage ── */
.verse-display.lower-third { display: block; padding: 0; background: transparent; }
.lower-third .verse-container { position: absolute; inset: 0; max-width: none; width: auto; padding: 0; background: transparent; }
.lt-box {
  position: absolute;
  left: 50%;
  bottom: 5%;
  transform: translateX(-50%);
  width: 75%;
  padding: 24px 34px;
  overflow: hidden;
  border-radius: 6px;
  background: linear-gradient(135deg, rgba(10, 18, 32, .94), rgba(37, 52, 78, .94));
  background-position: center;
  background-repeat: no-repeat;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .36);
  box-sizing: border-box;
}
.lt-box-media {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  z-index: 0;
}
.lt-box > :not(.lt-box-media) { position: relative; z-index: 1; }
.lt-box.lt-top { bottom: auto; top: 5%; }
.lower-third .verse-text { line-height: 1.22; }
.lower-third .lt-ref { margin-top: .45rem; opacity: .9; }

/* ── LT Broadcast Variant ── */
.verse-display.lt-broadcast .verse-reference-row { margin-bottom: .6rem; }
.verse-display.lt-broadcast .verse-reference { display: inline-block; background: #e8541a; color: #fff !important; border-radius: 999px; padding: .28em 1em; text-transform: none !important; text-shadow: none !important; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.verse-display.lt-broadcast .verse-text { background: #fff; color: #141414 !important; border-radius: 16px; padding: .5em .7em; text-shadow: none !important; box-shadow: 0 6px 22px rgba(0,0,0,.28); }

/* ── LT Design Overlay ── */
.app-lt-design { background-size: 100% auto; background-position: bottom center; }

/* ── Animations ── */
@keyframes backgroundFadeOut { 0% { opacity: 1; } to { opacity: 0; } }
@keyframes pulse { 0%, to { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(1.2); } }
@keyframes fadeInUp { 0% { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

/* ── Connection Status ── */

/* ── Waiting Screen ── */
.waiting-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: transparent; color: #fff; z-index: 1; }
.waiting-content { text-align: center; animation: fadeInUp .6s ease-out; }
.waiting-content h1 { font-size: 4rem; font-weight: 600; margin-bottom: 1rem; color: #fff; letter-spacing: 2px; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0px 0px 8px rgba(0,0,0,.8); }
.waiting-content p { font-size: 1.5rem; color: #fff; margin-bottom: 2rem; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0px 0px 6px rgba(0,0,0,.8); }
.status-indicator { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.2rem; color: #fff; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0px 0px 6px rgba(0,0,0,.8); }
.pulse-dot { width: 12px; height: 12px; border-radius: 50%; background: #4caf50; animation: pulse 2s infinite; }

/* ── Blackout ── */
.blackout-screen { position: absolute; inset: 0; width: auto; height: auto; background-color: #000 !important; z-index: 9999; display: none; }
.blackout-screen.active { display: block; }
</style>
</head>
<body>
<div id="root">
  <div class="app" id="app">
    <!-- Background Layer -->
    <div class="app-bg-layer" id="bgLayer"></div>
    <div class="app-bg-layer app-bg-previous" id="bgPrevLayer" style="display:none"></div>
    <!-- Motion Video -->
    <video class="app-bg-video" id="bgVideo" autoplay muted loop playsinline style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0"></video>
    <!-- Motion Background Iframe -->
    <iframe id="motionBg" style="display:none;position:absolute;inset:0;width:100%;height:100%;border:none;z-index:0;pointer-events:none"></iframe>
    <!-- Waiting Screen -->
    <div class="waiting-screen" id="waitingScreen">
      <div class="waiting-content">
        <h1>Bible Song Pro</h1>
        <p>Waiting for connection…</p>
        <div class="status-indicator"><div class="pulse-dot"></div><span>Display Standby</span></div>
      </div>
    </div>
    <!-- Verse Display -->
    <div class="verse-display hidden" id="verseDisplay">
      <div class="verse-container" id="verseContainer"></div>
    </div>
    <!-- Blackout -->
    <div class="blackout-screen" id="blackoutScreen"></div>
    <!-- No connection badge or fullscreen button: this surface is the audience output,
         and operator chrome must never be projected. Connection state is reported in
         the app's own status bar instead. -->
  </div>
</div>

<script>
(function() {
  'use strict';

  // ── Elements ──
  const app = document.getElementById('app');
  const bgLayer = document.getElementById('bgLayer');
  const bgPrevLayer = document.getElementById('bgPrevLayer');
  const bgVideo = document.getElementById('bgVideo');
  const waitingScreen = document.getElementById('waitingScreen');
  const verseDisplay = document.getElementById('verseDisplay');
  const verseContainer = document.getElementById('verseContainer');
  const blackoutScreen = document.getElementById('blackoutScreen');

  // ── State ──
  let currentVerse = null;
  let currentTheme = null;
  let config = {
    fontFamily: 'Poppins',
    fontSize: 0,
    fontWeight: 700,
    fontColor: '#ffffff',
    textAlign: 'center',
    referenceColor: '#e8541a',
    referenceFontSize: 0,
    animation: 'fade',
    mode: 'fullscreen',
    lowerThird: 'standard',
    translation: 'KJV',
    bgTheme: 'none',
    bgCustomImage: null,
    bgVideo: null,
    bgFill: null,
    blackout: false,
    showTranslation: true,
    showReference: true,
  };

  // ── Helpers ──
  function esc(s) { return String(s || '').replace(/[&<>"']/g, function(c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]; }); }

  function normalizeMode(mode) {
    var value = String(mode || '').toLowerCase().replace(/[-_\s]/g, '');
    if (value === 'lowerthird' || value === 'lt') return 'lowerThird';
    if (value === 'fullscreen' || value === 'fs') return 'fullscreen';
    return config.mode || 'fullscreen';
  }

  function isLowerThird() {
    return config.mode === 'lowerThird';
  }

  // ── Theme Application ──
  function applyTheme(name) {
    var classes = app.className.split(/\s+/).filter(function(c) { return c && c !== 'app' && c !== 'app-fs' && c !== 'app-lt' && c.indexOf('theme-') !== 0; });
    classes.unshift('app');
    if (isLowerThird()) classes.push('app-lt');
    else classes.push('app-fs');
    if (name && name !== 'none' && !isLowerThird()) classes.push('theme-' + name);
    app.className = classes.join(' ');
    if (!isLowerThird() && name === 'custom-image' && config.bgCustomImage) {
      bgLayer.style.backgroundImage = 'url(' + esc(config.bgCustomImage) + ')';
    }
  }

  function clearStageFill() {
    bgLayer.style.backgroundImage = '';
    bgLayer.style.backgroundColor = '';
    bgLayer.style.opacity = '1';
    bgVideo.style.display = 'none';
    bgVideo.removeAttribute('src');
    var motionEl = document.getElementById('motionBg');
    if (motionEl) { motionEl.style.display = 'none'; motionEl.src = ''; }
  }

  function applyStageFill(state) {
    if (isLowerThird()) {
      clearStageFill();
      return;
    }
    var bgImage = state.bgCustomImage || '';
    var bgFill = state.bgFill || '';
    config.bgCustomImage = bgImage || null;
    config.bgFill = bgFill || null;

    if (state.bgVideo) {
      if (config.bgVideo !== state.bgVideo) {
        config.bgVideo = state.bgVideo;
        bgVideo.src = state.bgVideo;
      }
      bgVideo.loop = state.bgVideoLoop !== false;
      bgVideo.style.objectFit = state.bgFit || 'cover';
      bgVideo.style.display = 'block';
      bgVideo.play().catch(function(){});
    } else {
      config.bgVideo = null;
      bgVideo.style.display = 'none';
      bgVideo.removeAttribute('src');
    }

    if (bgImage) {
      bgLayer.style.backgroundColor = '#000';
      bgLayer.style.backgroundImage = 'url("' + String(bgImage).replace(/"/g, '%22') + '")';
      bgLayer.style.backgroundSize = state.bgFit === 'contain' ? 'contain' : 'cover';
    } else if (bgFill && bgFill !== 'transparent') {
      var isGradient = bgFill.indexOf('gradient') !== -1;
      bgLayer.style.backgroundImage = isGradient ? bgFill : '';
      bgLayer.style.backgroundColor = isGradient ? '' : bgFill;
    } else if (bgFill === 'transparent') {
      bgLayer.style.backgroundImage = '';
      bgLayer.style.backgroundColor = 'transparent';
    } else {
      var themeBg = state.theme && state.theme.fullScreen ? (state.theme.fullScreen.background || state.theme.fullScreen.backgroundColor) : '';
      if (themeBg) {
        var isGrad = themeBg.indexOf('gradient') !== -1;
        bgLayer.style.backgroundImage = isGrad ? themeBg : '';
        bgLayer.style.backgroundColor = isGrad ? '' : themeBg;
      } else {
        bgLayer.style.backgroundImage = '';
        bgLayer.style.backgroundColor = '#0c0e14';
      }
    }
    bgLayer.style.opacity = typeof state.bgOpacity === 'number' ? String(state.bgOpacity) : '1';
  }

  // ── Render Verse ──
  function renderVerse(verse) {
    currentVerse = verse;
    if (!verse) {
      verseDisplay.classList.remove('visible', 'fading-in');
      verseDisplay.classList.add('hidden');
      return;
    }

    // Mode classes
    verseDisplay.classList.remove('lower-third', 'lt-broadcast');
    if (isLowerThird()) {
      verseDisplay.classList.add('lower-third');
      if (config.lowerThird === 'broadcast') verseDisplay.classList.add('lt-broadcast');
    }

    const text = verse.text || verse.displayText || '';
    const ref = verse.displayReference || verse.reference || '';

    // Style from config
    var fs = config.fontSize > 0 ? config.fontSize + 'px' : (isLowerThird() ? 'clamp(16px,2.2vw,44px)' : 'clamp(20px,2.8vw,64px)');
    var refFs = config.referenceFontSize > 0 ? config.referenceFontSize + 'px' : 'clamp(12px,1.4vw,28px)';

    var themeSec = isLowerThird()
      ? (currentTheme && currentTheme.lowerThird)
      : (currentTheme && currentTheme.fullScreen);
    var syncRef = themeSec && themeSec.syncRefColor;
    var refColor = syncRef ? config.fontColor : (themeSec && themeSec.referenceColor ? themeSec.referenceColor : config.referenceColor);

    var shadowEnabled = themeSec && themeSec.textShadowEnabled;
    var shadowBlur = themeSec && typeof themeSec.textShadowBlur === 'number' ? themeSec.textShadowBlur : (themeSec && themeSec.textShadowLevel === 'heavy' ? 12 : 6);
    var shadowColor = themeSec && themeSec.textShadowColor ? themeSec.textShadowColor : 'rgba(0,0,0,0.85)';
    var shadowStyle = shadowEnabled ? 'text-shadow: 0px 2px ' + shadowBlur + 'px ' + shadowColor + ';' : '';

    // Dual-translation check
    var isCompare = verse.compareLeft && verse.compareRight;

    var html = '';
    if (verse.wordStudy) {
      var ws = verse.wordStudy;
      html =
        '<div style="width:min(92vw,1400px);display:grid;grid-template-columns:1fr 1.4fr;gap:3vw;align-items:center;padding:4vh 4vw;box-sizing:border-box;">' +
          '<div style="border-right:1px solid rgba(255,255,255,.14);padding-right:3vw;">' +
            '<div style="font-size:clamp(40px,6vw,96px);font-weight:900;color:#FF5500;line-height:1.05;font-family:' + (ws.language === 'Hebrew' ? 'serif' : config.fontFamily) + ';">' + esc(ws.lemma || '') + '</div>' +
            (ws.transliteration ? '<div style="margin-top:.4em;font-size:clamp(18px,2.4vw,32px);font-style:italic;opacity:.9;">/ ' + esc(ws.transliteration) + ' /</div>' : '') +
            (ws.strongs ? '<div style="display:inline-block;margin-top:.8em;padding:.25em .7em;border-radius:8px;background:rgba(255,85,0,.25);color:#FF5500;border:1px solid rgba(255,85,0,.5);font-weight:800;letter-spacing:.04em;">' + esc(ws.strongs) + (ws.language ? ' (' + esc(ws.language) + ')' : '') + '</div>' : '') +
            (ws.gloss ? '<div style="margin-top:.8em;font-size:clamp(20px,2.8vw,36px);font-weight:800;">' + esc(ws.gloss) + '</div>' : '') +
          '</div>' +
          '<div style="font-size:clamp(18px,2.4vw,34px);line-height:1.35;font-weight:600;">' + esc(ws.definition || text) + '</div>' +
        '</div>';
    } else if (isCompare) {
      html = '<div class="compare-layout">' +
        '<div class="compare-pane">' +
          (verse.compareLeft.ref ? '<div class="verse-reference-row" style="justify-content:center;gap:.75rem;margin-bottom:1.5rem;font-family:' + config.fontFamily + ';font-size:' + refFs + '"><span class="verse-reference" style="font-family:' + config.fontFamily + ';color:' + esc(refColor) + ';font-weight:' + config.fontWeight + ';' + shadowStyle + '">' + esc(verse.compareLeft.ref) + '</span></div>' : '') +
        '<div class="verse-text" style="font-family:' + config.fontFamily + ';font-size:' + fs + ';font-weight:' + config.fontWeight + ';color:' + esc(config.fontColor) + ';text-align:' + config.textAlign + ';' + shadowStyle + '">' + esc(verse.compareLeft.text) + '</div></div>' +
        '<div class="compare-divider"></div>' +
        '<div class="compare-pane">' +
          (verse.compareRight.ref ? '<div class="verse-reference-row" style="justify-content:center;gap:.75rem;margin-bottom:1.5rem;font-family:' + config.fontFamily + ';font-size:' + refFs + '"><span class="verse-reference" style="font-family:' + config.fontFamily + ';color:' + esc(refColor) + ';font-weight:' + config.fontWeight + ';' + shadowStyle + '">' + esc(verse.compareRight.ref) + '</span></div>' : '') +
        '<div class="verse-text" style="font-family:' + config.fontFamily + ';font-size:' + fs + ';font-weight:' + config.fontWeight + ';color:' + esc(config.fontColor) + ';text-align:' + config.textAlign + ';' + shadowStyle + '">' + esc(verse.compareRight.text) + '</div></div>' +
      '</div>';
    } else if (isLowerThird()) {
      var lt = (currentTheme && currentTheme.lowerThird) || {};
      var width = typeof lt.width === 'number' ? lt.width : 75;
      var radius = typeof lt.borderRadius === 'number' ? lt.borderRadius : 6;
      var boxBg = lt.background || 'linear-gradient(135deg, rgba(10, 18, 32, .94), rgba(37, 52, 78, .94))';
      var anchor = lt.anchor || 'bottom';
      var ltMediaUrl = lt.backgroundMediaUrl || '';
      var ltMediaType = lt.backgroundMediaType || '';
      var ltFit = lt.backgroundFit === 'contain' ? 'contain' : lt.backgroundFit === 'fill' ? 'fill' : 'cover';
      var ltBoxStyle = 'width:' + width + '%;border-radius:' + radius + 'px;text-align:' + config.textAlign + ';';
      if (ltMediaType === 'image' && ltMediaUrl) {
        ltBoxStyle += 'background-color:#000;background-image:url("' + String(ltMediaUrl).replace(/"/g, '%22') + '");background-size:' + (ltFit === 'fill' ? '100% 100%' : ltFit) + ';background-position:center;background-repeat:no-repeat;';
      } else if (ltMediaType === 'video' && ltMediaUrl) {
        ltBoxStyle += 'background:#000;';
      } else {
        ltBoxStyle += 'background:' + boxBg + ';';
      }
      var ltVideo = (ltMediaType === 'video' && ltMediaUrl)
        ? '<video class="lt-box-media" src="' + esc(ltMediaUrl) + '" autoplay muted playsinline' + (lt.backgroundLoop === false ? '' : ' loop') + ' style="object-fit:' + ltFit + ';"></video>'
        : '';
      verseDisplay.style.alignItems = '';
      verseDisplay.style.justifyContent = '';
      html = '<div class="lt-box' + (anchor === 'top' ? ' lt-top' : '') + '" style="' + ltBoxStyle + '">' +
        ltVideo +
        '<div class="verse-text" style="font-family:' + config.fontFamily + ';font-size:' + fs + ';font-weight:' + config.fontWeight + ';color:' + esc(config.fontColor) + ';text-align:' + config.textAlign + ';' + shadowStyle + '">' + esc(text) + '</div>' +
        (config.showReference && ref ? '<div class="lt-ref" style="font-family:' + config.fontFamily + ';font-size:' + refFs + ';font-weight:' + config.fontWeight + ';color:' + esc(refColor) + ';text-align:' + config.textAlign + ';' + shadowStyle + '">' + esc(ref) + '</div>' : '') +
      '</div>';
    } else {
      var vAlign = (currentTheme && currentTheme.fullScreen && currentTheme.fullScreen.verticalAlign) || 'middle';
      verseDisplay.style.justifyContent = vAlign === 'top' ? 'flex-start' : (vAlign === 'bottom' ? 'flex-end' : 'center');
      verseDisplay.style.alignItems = 'center';
      var refJustify = config.textAlign === 'left' ? 'flex-start' : (config.textAlign === 'right' ? 'flex-end' : 'center');
      html = '';
      if (config.showReference && ref) {
        html += '<div class="verse-reference-row" style="font-family:' + config.fontFamily + ';font-size:' + refFs + ';justify-content:' + refJustify + ';text-align:' + config.textAlign + '">' +
          '<span class="verse-reference" style="font-family:' + config.fontFamily + ';color:' + esc(refColor) + ';font-weight:' + config.fontWeight + ';' + shadowStyle + '">' + esc(ref) + '</span>' +
        '</div>';
      }
      html += '<div class="verse-text" style="font-family:' + config.fontFamily + ';font-size:' + fs + ';font-weight:' + config.fontWeight + ';color:' + esc(config.fontColor) + ';text-align:' + config.textAlign + ';line-height:' + ((currentTheme && currentTheme.fullScreen && currentTheme.fullScreen.lineHeight) || 1.25) + ';' + shadowStyle + '">' + esc(text) + '</div>';
    }

    // Song credit footer — small, low-contrast, always last. Most CCLI licences
    // require title/author/copyright/licence number to be visible while projecting.
    var credit = verse.songCredit;
    if (credit) {
      var creditParts = [];
      if (credit.title) creditParts.push(esc(credit.title));
      if (credit.author) creditParts.push(esc(credit.author));
      if (credit.copyright) creditParts.push(esc(credit.copyright));
      if (credit.ccli) creditParts.push('CCLI ' + esc(credit.ccli));
      if (creditParts.length) {
        html += '<div class="song-credit">' + creditParts.join(' · ') + '</div>';
      }
    }

    verseContainer.innerHTML = html;
    verseDisplay.classList.remove('hidden', 'fading-out');
    verseDisplay.classList.add('visible');
    waitingScreen.style.display = 'none';
  }

  // ── Hide Verse ──
  function hideVerse() {
    if (!currentVerse) return;
    verseDisplay.classList.remove('fading-in', 'visible');
    verseDisplay.classList.add('fading-out');
    setTimeout(function() {
      verseDisplay.classList.add('hidden');
      verseDisplay.classList.remove('fading-out');
      currentVerse = null;
    }, 350);
  }

  // ── Lyric Display ──
  function renderLyrics(lyrics) {
    if (!lyrics || !Array.isArray(lyrics.lines)) return;
    var html = '<div class="lyrics-text-block">';
    for (var i = 0; i < lyrics.lines.length; i++) {
      html += '<div class="lyrics-line" style="font-family:' + config.fontFamily + ';font-size:' + (config.fontSize > 0 ? config.fontSize + 'px' : 'clamp(24px,3.2vw,72px)') + ';font-weight:' + config.fontWeight + ';color:' + esc(config.fontColor) + ';text-align:' + config.textAlign + '">' + esc(lyrics.lines[i]) + '</div>';
    }
    html += '</div>';
    verseContainer.innerHTML = html;
    verseDisplay.classList.remove('hidden', 'fading-out');
    verseDisplay.classList.add('visible');
    waitingScreen.style.display = 'none';
  }

  // ── Handle State ──
  function handleStateUpdate(state) {
    if (!state) return;
    try {

    if (state.theme) currentTheme = state.theme;
    if (state.fontFamily) config.fontFamily = state.fontFamily;
    if (typeof state.fontSize === 'number') config.fontSize = state.fontSize;
    if (state.fontWeight) config.fontWeight = state.fontWeight;
    if (state.fontColor) config.fontColor = state.fontColor;
    if (state.textAlign) config.textAlign = state.textAlign;
    if (state.referenceColor) config.referenceColor = state.referenceColor;
    if (typeof state.referenceFontSize === 'number') config.referenceFontSize = state.referenceFontSize;
    if (state.outputMode || state.mode) config.mode = normalizeMode(state.outputMode || state.mode);
    if (state.lowerThird) config.lowerThird = state.lowerThird;
    if (state.translation) config.translation = state.translation;
    if (typeof state.showTranslation === 'boolean') config.showTranslation = state.showTranslation;
    if (typeof state.showReference === 'boolean') config.showReference = state.showReference;

    applyTheme(state.bgTheme || config.bgTheme);
    applyStageFill(state);

    // Motion background (canvas HTML) — fullscreen only
    var motionEl = document.getElementById('motionBg');
    if (isLowerThird()) {
      if (motionEl) { motionEl.style.display = 'none'; motionEl.src = ''; }
    } else if (state.bgMotion) {
      config.bgMotion = state.bgMotion;
      motionEl.src = state.bgMotion;
      motionEl.style.display = 'block';
    } else if (state.bgMotion === null || state.bgMotion === '') {
      motionEl.style.display = 'none';
      motionEl.src = '';
    }

    // Blackout
    if (typeof state.blackout === 'boolean') {
      config.blackout = state.blackout;
      blackoutScreen.classList.toggle('active', state.blackout);
    }

    // Extract verse from scene.content format (used by session history and REST API)
    var verseData = state.verse || state.displayVerse || null;
    if (!verseData && state.scene && state.scene.content) {
      var sc = state.scene.content;
      if (sc.text) {
        // Only Bible content inherits the default translation; a song has none, and
        // would otherwise be labelled with whatever version was last used.
        verseData = {
          text: sc.text,
          reference: sc.reference,
          translation: sc.version || (sc.songCredit ? '' : config.translation),
        };
        if (sc.secondaryVerse && sc.secondaryVerse.text) {
          var baseRef = (sc.reference || '').replace(/\s*\([^)]*\/[^)]*\)\s*$/, '').trim();
          var pVer = sc.version ? sc.version.split('/')[0] : '';
          var sVer = sc.secondaryVerse.version || (sc.version ? sc.version.split('/')[1] : '');

          var lRef = pVer && sc.reference && !sc.reference.includes('(' + pVer + ')') ? (baseRef.split(' (')[0] + ' (' + pVer + ')') : sc.reference;
          var rRef = sVer && !(sc.secondaryVerse.reference || '').includes('(' + sVer + ')') ? ((sc.secondaryVerse.reference || baseRef).split(' (')[0] + ' (' + sVer + ')') : (sc.secondaryVerse.reference || sc.reference);

          verseData.compareLeft = { text: sc.text, ref: lRef, translation: '' };
          verseData.compareRight = {
            text: sc.secondaryVerse.text,
            ref: rRef,
            translation: '',
          };
        }
        if (sc.songCredit) verseData.songCredit = sc.songCredit;
        if (sc.wordStudy) verseData.wordStudy = sc.wordStudy;
      }
    }
    if (!verseData && (state.lowerThirdText || state.lowerThirdSub)) {
      verseData = {
        text: state.lowerThirdText || state.lowerThirdSub,
        reference: state.lowerThirdText && state.lowerThirdSub ? state.lowerThirdSub : '',
      };
    }
    if (!verseData && state.type === 'verse' && state.scene && state.scene.content) {
      var sc = state.scene.content;
      if (sc.text && sc.reference) {
        verseData = { text: sc.text, reference: sc.reference, translation: sc.version || config.translation };
      }
    }

    // Verse rendering. Once the operator console has pushed any state, the
    // standby card must not stay on air — OBS would broadcast "Waiting for
    // connection" over the sermon. Empty program is black / transparent.
    waitingScreen.style.display = 'none';
    if (verseData) {
      renderVerse(verseData);
    } else if (!state.scene || state.type === 'hide_verse' || state.type === 'clear') {
      hideVerse();
    }

    // Lyrics
    if (state.lyrics) renderLyrics(state.lyrics);
    } catch (err) {
      console.error('display state update failed', err);
    }
  }

  function applyPayload(raw) {
    var msg = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!msg) return;
    if (msg.type === 'display:update') handleStateUpdate(msg.state);
    else if (msg.state) handleStateUpdate(msg.state);
    else handleStateUpdate(msg);
  }

  function applySocketData(data) {
    if (typeof Blob !== 'undefined' && data instanceof Blob) {
      data.text().then(function(text) { try { applyPayload(text); } catch (e) { /* ignore */ } });
      return;
    }
    applyPayload(typeof data === 'string' ? data : String(data));
  }

  /* OBS Browser Source on macOS often loads http://localhost but fails to open
     ws://localhost (IPv6 ::1 vs an IPv4-only listener, and CEF without a
     reliable WebSocket). The page itself arrived over HTTP, so polling
     /api/display/state is the path that actually reaches Program. WebSocket
     stays as a faster path when the host allows it. */
  function pollState() {
    fetch('/api/display/state', { cache: 'no-store' })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data && data.state) handleStateUpdate(data.state);
      })
      .catch(function() { /* retry on the next interval */ });
  }

  function socketUrls() {
    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var port = location.port || '8942';
    var host = location.hostname || '127.0.0.1';
    var urls = [protocol + '//' + host + (port ? ':' + port : '')];
    if (host === 'localhost') urls.push(protocol + '//127.0.0.1' + (port ? ':' + port : ''));
    else if (host === '127.0.0.1') urls.push(protocol + '//localhost' + (port ? ':' + port : ''));
    return urls;
  }

  var reconnectTimer = null;
  function connectSocket(urlIndex) {
    var urls = socketUrls();
    var index = urlIndex || 0;
    var url = urls[index];
    if (!url) {
      reconnectTimer = setTimeout(function() { connectSocket(0); }, 2000);
      return;
    }
    var ws;
    try { ws = new WebSocket(url); } catch (err) {
      connectSocket(index + 1);
      return;
    }
    ws.onmessage = function(event) {
      try { applySocketData(event.data); } catch (e) { /* ignore parse errors */ }
    };
    ws.onclose = function() {
      if (index + 1 < urls.length) connectSocket(index + 1);
      else reconnectTimer = setTimeout(function() { connectSocket(0); }, 1000);
    };
    ws.onerror = function() { try { ws.close(); } catch (e) { /* already closed */ } };
  }

  // ── Init ──
  function updateStageScale() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    app.style.setProperty('--stage-scale', String(s));
  }
  updateStageScale();
  window.addEventListener('resize', updateStageScale);
  applyTheme(config.bgTheme);
  waitingScreen.style.display = 'flex';
  pollState();
  setInterval(pollState, 150);
  connectSocket(0);
})();
</script>
</body>
</html>
