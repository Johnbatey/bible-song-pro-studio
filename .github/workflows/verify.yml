# The headless half of `npm run verify:all`.
#
# The other half — verify:display-all — drives real Electron windows, projects
# to a display and compares audience output pixel by pixel. That cannot run
# here honestly, so it stays on the machine with a screen. What runs here is
# everything that needs nothing but Node, which is most of the guards.
#
# The point is not redundancy with local runs. It is that the Bible licensing
# check is currently a pre-commit hook, and a hook only protects the machine
# that installed it — clone this repo somewhere else, skip install-hooks.cjs,
# and an unvetted translation commits cleanly. Here it is not optional.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-latest
    env:
      # onnxruntime-node's CUDA EP fetch is skipped from the project .npmrc, so
      # the plain `npm ci` below is exactly the install a developer does. Do not
      # add a job-level override for it here: CI is the proof that a fresh Linux
      # clone installs cleanly.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Bible canon and licensing
        run: npm run verify:bibles

      # The XML, JSON and SQLite importers and the book numbers they store,
      # including the Zefania n="1 Samuel" case that used to become book 1.
      - name: Bible import and book mapping
        run: npm run verify:bible-import

      # Byte-level only. Whether the faces actually render is verify:fonts-render,
      # which needs a window and stays local.
      - name: Bundled fonts are fonts
        run: npm run verify:fonts

      - name: Media library
        run: npm run verify:media

      - name: Slide element parity
        run: npm run verify:slide-parity

      - name: Song arrangement
        run: npm run verify:song-arrange

      - name: Live scripture parser
        run: npm run test:live-scripture

      # Boots the real main process with `electron` stubbed, so no window and no
      # display are needed: it asks the running server whether the API, the
      # projector pages and the WebSocket handshake actually refuse a client
      # that was never handed the session token.
      - name: Remote auth gate
        run: npm run verify:remote-auth

      # Also stubs `electron` and boots main.cjs: it closes the main window after
      # opening and hiding a stage designer, and asserts that the app quits, that
      # the hidden prewarmed designer is closed, and that no window survives.
      - name: Shutdown closes every window (#24)
        run: npm run verify:shutdown

      - name: Renderer build
        run: npm run build:renderer
