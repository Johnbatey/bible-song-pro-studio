<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Song Pro</title>
<style>
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url('./fonts/InterVariable.woff2') format('woff2');
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0f0f11;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* Ambient Background Lighting & Perspective Grid */
.bg-mesh {
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 50% 28%, rgba(255, 85, 0, 0.18) 0%, rgba(24, 24, 27, 0.15) 50%, transparent 80%),
    radial-gradient(circle at 18% 75%, rgba(255, 85, 0, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 82% 75%, rgba(255, 119, 40, 0.05) 0%, transparent 40%);
  z-index: 0;
}

.bg-grid {
  position: fixed;
  inset: 0;
  background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
  z-index: 0;
  opacity: 0.8;
}

.particles-canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

/* Center Stage Layout */
.stage {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 46px 40px 36px;
  z-index: 2;
}

/* Top Section: Emblem & Pure Metallic Brand Title */
.hero-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.logo-container {
  position: relative;
  width: 92px;
  height: 92px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 22px;
}

.logo-pulse-ring {
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  border: 1px solid rgba(255, 85, 0, 0.35);
  box-shadow: 0 0 24px rgba(255, 85, 0, 0.25);
  animation: pulseRing 4s ease-in-out infinite alternate;
}

.logo-rotate-ticks {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px dashed rgba(255, 255, 255, 0.12);
  animation: rotateClockwise 25s linear infinite;
}

.logo-backglow {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 85, 0, 0.4) 0%, rgba(30, 20, 15, 0.1) 60%, transparent 75%);
  filter: blur(10px);
}

.logo-img {
  width: 78px;
  height: 78px;
  position: relative;
  z-index: 2;
  object-fit: contain;
  filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.75)) drop-shadow(0 0 14px rgba(255, 85, 0, 0.4));
  animation: floatLogo 3s ease-in-out infinite alternate;
}

.app-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.03em;
  background: linear-gradient(180deg, #FFFFFF 0%, #E4E4E7 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.1;
  margin-bottom: 6px;
  animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
  opacity: 0;
}

.app-subtitle {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.42);
  animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  opacity: 0;
}

/* Middle Section: Minimalist Glass Quote Plate */
.scripture-plate {
  position: relative;
  width: 100%;
  max-width: 560px;
  padding: 16px 28px;
  border-radius: 12px;
  background: rgba(24, 24, 27, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(16px);
  text-align: center;
  animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
  opacity: 0;
}

.scripture-text {
  font-size: 13px;
  font-weight: 300;
  font-style: italic;
  color: rgba(255, 255, 255, 0.9);
  line-height: 1.6;
  letter-spacing: 0.01em;
}

.scripture-ref {
  margin-top: 6px;
  font-size: 11px;
  font-weight: 700;
  font-style: normal;
  letter-spacing: 0.12em;
  color: #FF5500;
  text-transform: uppercase;
}

/* Bottom Section: 2px Hairline Progress & Diagnostics */
.footer-section {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
  opacity: 0;
}

.progress-track {
  width: 100%;
  height: 2px;
  border-radius: 1px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
  position: relative;
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background: linear-gradient(90deg, #FF5500, #FF7728, #FFA066);
  box-shadow: 0 0 10px rgba(255, 85, 0, 0.7);
  animation: loadProgress 3.5s cubic-bezier(0.1, 0.7, 0.1, 1) 0.2s forwards;
}

.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 0 2px;
}

.status-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: rgba(255, 255, 255, 0.42);
  text-transform: uppercase;
  transition: opacity 0.15s ease;
}

.status-version {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: rgba(255, 255, 255, 0.22);
}

/* Keyframe Animations */
@keyframes pulseRing {
  0% { transform: scale(0.96); opacity: 0.4; }
  50% { transform: scale(1.04); opacity: 0.8; }
  100% { transform: scale(0.96); opacity: 0.4; }
}

@keyframes rotateClockwise {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes floatLogo {
  0% { transform: translateY(0); }
  100% { transform: translateY(-6px); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes loadProgress {
  0% { width: 0%; }
  35% { width: 45%; }
  70% { width: 80%; }
  100% { width: 100%; }
}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="bg-grid"></div>
<canvas id="particles-canvas" class="particles-canvas"></canvas>

<div class="stage">
  <!-- Top Hero Section -->
  <div class="hero-section">
    <div class="logo-container">
      <div class="logo-backglow"></div>
      <div class="logo-pulse-ring"></div>
      <div class="logo-rotate-ticks"></div>
      <img src="./bible-song-pro-icon.svg" class="logo-img" alt="Bible Song Pro Emblem" />
    </div>

    <h1 class="app-title">Bible Song Pro</h1>
    <div class="app-subtitle">Presentation & Media Sanctuary</div>
  </div>

  <!-- Middle Scripture Quote Glass Plate -->
  <div class="scripture-plate">
    <div class="scripture-text">
      "He was wounded for our transgressions, He was bruised for our iniquities; the chastisement of our peace was upon Him, and by His stripes we are healed."
    </div>
    <div class="scripture-ref">— ISAIAH 53:5</div>
  </div>

  <!-- Bottom Hairline Progress & Diagnostics -->
  <div class="footer-section">
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <div class="status-row">
      <span class="status-label" id="statusText">INITIALIZING SANCTUARY CORE...</span>
      <span class="status-version">v1.0.0</span>
    </div>
  </div>
</div>

<script>
// Floating Constellation Dust Particles
const pCanvas = document.getElementById('particles-canvas');
const pCtx = pCanvas.getContext('2d');

function resizeCanvas() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const particles = [];
for (let i = 0; i < 55; i++) {
  particles.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.8 + 0.6,
    dx: (Math.random() - 0.5) * 0.25,
    dy: -Math.random() * 0.4 - 0.1,
    opacity: Math.random() * 0.5 + 0.15,
  });
}

function drawParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  particles.forEach((p) => {
    p.x += p.dx;
    p.y += p.dy;
    if (p.y < 0) {
      p.y = pCanvas.height + 10;
      p.x = Math.random() * pCanvas.width;
    }
    if (p.x < 0) p.x = pCanvas.width;
    if (p.x > pCanvas.width) p.x = 0;

    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pCtx.fillStyle = `rgba(147, 197, 253, ${p.opacity})`;
    pCtx.fill();
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

// Broadcast initialization status stages
const stages = [
  { time: 600, text: 'LOADING SCRIPTURE ENGINE...' },
  { time: 1400, text: 'PREPARING MEDIA & DISPLAY SERVICES...' },
  { time: 2200, text: 'CONNECTING NDI & HARDWARE OUTPUTS...' },
  { time: 2900, text: 'READY — ENTER THE SANCTUARY' },
];

stages.forEach((s) => {
  setTimeout(() => {
    const el = document.getElementById('statusText');
    if (el) {
      el.style.opacity = '0.4';
      setTimeout(() => {
        el.textContent = s.text;
        el.style.opacity = '1';
      }, 100);
    }
  }, s.time);
});
</script>
</body>
</html>
