<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Song Pro Max</title>
<style>
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url('./fonts/InterVariable.woff2') format('woff2');
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #060810;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

.particles-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.splash-card {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 32px;
  z-index: 1;
  text-align: center;
}

.logo-wrapper {
  position: relative;
  width: 80px;
  height: 80px;
  margin-bottom: 20px;
  animation: logoFloat 3.5s ease-in-out infinite alternate;
}

.logo-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 8px 24px rgba(30, 58, 110, 0.65)) drop-shadow(0 0 16px rgba(245, 158, 11, 0.25));
  animation: logoPop 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.logo-glow {
  position: absolute;
  inset: -20px;
  background: radial-gradient(circle, rgba(96, 165, 250, 0.2) 0%, rgba(245, 158, 11, 0.1) 45%, transparent 70%);
  border-radius: 50%;
  animation: pulseGlow 3s ease-in-out infinite alternate;
  z-index: -1;
}

.app-title {
  font-size: 32px;
  font-weight: 800;
  color: #f8fafc;
  letter-spacing: -0.02em;
  line-height: 1.15;
  opacity: 0;
  animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
}

.app-title .pro {
  color: #60a5fa;
  font-weight: 800;
}

.app-title .max {
  color: #f59e0b;
  font-weight: 800;
}

.app-subtitle {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.45);
  margin-top: 8px;
  opacity: 0;
  animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
}

.scripture-box {
  margin-top: 24px;
  padding: 16px 24px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(12px);
  max-width: 520px;
  opacity: 0;
  animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
}

.scripture-quote {
  font-size: 13px;
  font-weight: 300;
  font-style: italic;
  color: rgba(248, 250, 252, 0.75);
  line-height: 1.6;
}

.scripture-ref {
  margin-top: 6px;
  font-size: 11px;
  font-weight: 600;
  font-style: normal;
  letter-spacing: 0.08em;
  color: #f59e0b;
  opacity: 0.85;
}

.loading-footer {
  margin-top: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 220px;
  opacity: 0;
  animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
}

.loading-bar {
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}

.loading-fill {
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background: linear-gradient(90deg, #3b82f6, #60a5fa, #f59e0b);
  animation: fillProgress 3.2s cubic-bezier(0.1, 0.7, 0.1, 1) 0.3s forwards;
}

.loading-status {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: rgba(255, 255, 255, 0.4);
  text-transform: uppercase;
}

@keyframes logoPop {
  from { opacity: 0; transform: scale(0.7); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes logoFloat {
  0% { transform: translateY(0); }
  100% { transform: translateY(-8px); }
}

@keyframes pulseGlow {
  0% { opacity: 0.4; transform: scale(0.95); }
  100% { opacity: 0.8; transform: scale(1.1); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fillProgress {
  to { width: 100%; }
}
</style>
</head>
<body>
<canvas id="particles-canvas" class="particles-canvas"></canvas>

<div class="splash-card">
  <div class="logo-wrapper">
    <div class="logo-glow"></div>
    <img src="./bible-song-pro-icon.svg" class="logo-img" alt="Bible Song Pro Max Logo" />
  </div>

  <div class="app-title">Bible Song <span class="pro">PRO</span> <span class="max">Max</span></div>
  <div class="app-subtitle">Presentation & Media Sanctuary</div>

  <div class="scripture-box">
    <div class="scripture-quote">
      "He was wounded for our transgressions, He was bruised for our iniquities; the chastisement of our peace was upon Him, and by His stripes we are healed."
    </div>
    <div class="scripture-ref">— Isaiah 53:5</div>
  </div>

  <div class="loading-footer">
    <div class="loading-bar"><div class="loading-fill"></div></div>
    <div class="loading-status" id="loading-status">PREPARING THE SANCTUARY</div>
  </div>
</div>

<script>
// Floating dust particles
const pCanvas = document.getElementById('particles-canvas');
const pCtx = pCanvas.getContext('2d');
pCanvas.width = window.innerWidth;
pCanvas.height = window.innerHeight;

const particles = [];
for (let i = 0; i < 70; i++) {
  particles.push({
    x: Math.random() * pCanvas.width,
    y: Math.random() * pCanvas.height,
    r: Math.random() * 2 + 0.5,
    dx: (Math.random() - 0.5) * 0.3,
    dy: (Math.random() - 0.5) * 0.3,
    opacity: Math.random() * 0.4 + 0.1,
  });
}

function drawParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  particles.forEach((p) => {
    p.x += p.dx;
    p.y += p.dy;
    if (p.x < 0) p.x = pCanvas.width;
    if (p.x > pCanvas.width) p.x = 0;
    if (p.y < 0) p.y = pCanvas.height;
    if (p.y > pCanvas.height) p.y = 0;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pCtx.fillStyle = `rgba(96, 165, 250, ${p.opacity})`;
    pCtx.fill();
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

window.addEventListener('resize', () => {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
});

setTimeout(() => {
  const text = document.getElementById('loading-status');
  if (text) text.textContent = 'ENTER THE SANCTUARY';
}, 2800);
</script>
</body>
</html>
