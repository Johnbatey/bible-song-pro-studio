<!DOCTYPE html><html><body style="margin:0;overflow:hidden;background:#000"><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");c.width=1920;c.height=1080;const p=Array.from({length:80},()=>({x:Math.random()*1920,y:Math.random()*1080,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*2+1}));function draw(){ctx.fillStyle="rgba(0,0,0,0.08)";ctx.fillRect(0,0,1920,1080);p.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;if(pt.x<0||pt.x>1920)pt.vx*=-1;if(pt.y<0||pt.y>1080)pt.vy*=-1;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fillStyle=;ctx.fill()});requestAnimationFrame(draw)}draw()</script></body></html>
