    /* No name: the console names it, using the desk's clock and the one rule the
       desktop uses, so a service started here is filed like one started there. */
    const data = await api('POST', '/api/session/start', {});
    if (data && data.ok !== false) {
      /* The name comes back from the console, so the operator sees what the
         service will be filed as rather than a bare "started". */
      const name = String((data.session && data.session.name) || '');
      await loadStatus();
      toast(name ? name + ' started' : 'Session started');
    }
    else toast('Could not start a session', true);
  }

  /* A shared phone should open next week's service with nothing on it from this
     one. Both lists are per device, so this is cleared here rather than asked
     of the desk — and only after the session is safely saved, so a failure to
     end it leaves the history where the operator can still use it. */
  function clearHistoryLists() {
    try {
      localStorage.removeItem(RECENT_KEY);
      localStorage.removeItem(STUDY_KEY);
    } catch { /* storage off */ }
    ['clearRecents', 'clearStudied'].forEach((id) => {
      const button = $(id);
      if (!button) return;
      button.dataset.armed = '';
      button.textContent = 'Clear';
    });
    paintRecents([]);
    paintStudied();
  }

  /* Ending also discards both history lists, so it takes two taps like the Clear
     buttons. The armed window is kept by the console, not by this page: a tap on
     the desk's End button disarms this one before the second tap could land, and
     an armed button left in a pocket expires on the console's clock. */
  function paintEndArm(armed) {
    const button = $('sessionEnd');
    button.dataset.armed = armed ? '1' : '';
    button.textContent = armed ? 'Sure? End' : 'End';
  }

  function endSession() {
    const button = $('sessionEnd');
    if (button.dataset.armed !== '1') {
      paintEndArm(true); // optimistic; the console's echo is authoritative
      api('POST', '/api/session/end/arm', { armed: true });
      return;
    }
    paintEndArm(false);
    api('POST', '/api/session/end/arm', { armed: false });
    /* Disabled rather than just ignored, so a third tap during the request
       cannot fire a second end. loadStatus decides the real state. */
    button.disabled = true;
    finishSession();
  }

  async function finishSession() {
    /* Read the name before ending: afterwards there is no service to name, and
       the toast is the last chance to say which one was filed. */
    const ending = serviceName();
    const name = ending === 'This service' ? '' : ending;
    const data = await api('POST', '/api/session/end');
    if (data && data.ok) {
      clearHistoryLists();
      toast((name ? name + ' saved' : 'Session saved') + ' · history cleared');
      await loadStatus();
      loadSessions();
    } else toast('Could not end the session', true);
  }

  /* ── 3c. ndi ──────────────────────────────────────────── */

  function renderNdi() {
    const ndi = (status && status.ndi) || {};
    const running = Boolean(ndi.running);
    $('ndiState').textContent = running ? 'Streaming' : (ndi.available ? 'Idle' : 'Unavailable');
    $('ndiNote').textContent = ndi.lastError
      ? ndi.lastError
      : 'Streams this console to OBS, vMix or another machine.';

    const rows = [
      ['Source', ndi.source || '—'],
      ['Resolution', ndi.width && ndi.height ? ndi.width + '×' + ndi.height : '—'],
      ['Consumers', String(ndi.connections || 0)],
      ['Feeds', String(ndi.activeFeedCount || 0)],
    ];
    $('ndiRows').innerHTML = '';
    rows.forEach(([label, value]) => {
      const row = document.createElement('div');
      row.className = 'row';
      const key = document.createElement('span');
      key.textContent = label;
      const val = document.createElement('span');
      val.className = 'mono';
      val.textContent = value;
      row.appendChild(key);
      row.appendChild(val);
      $('ndiRows').appendChild(row);
    });
    $('ndiStart').disabled = running || !ndi.available;
    $('ndiStop').disabled = !running;
  }

  async function startNdi() {
    const data = await api('POST', '/api/ndi/start');
    if (data && data.ok) { toast('NDI started'); await loadStatus(); }
    else toast((data && data.error) || 'Could not start NDI', true);
  }

  async function stopNdi() {
    const data = await api('POST', '/api/ndi/stop');
    if (data && data.ok) { toast('NDI stopped'); await loadStatus(); }
    else toast('Could not stop NDI', true);
  }

  /* ── status + live state ──────────────────────────────── */

  async function loadStatus() {
    const data = await api('GET', '/api/status');
    if (!data || !data.ok) { renderScreens(); return; }
    status = data;
    if (data.displayState) live = data.displayState;
    renderScreens();
    renderSessionStatus();
    renderNdi();
    afterProgramChange();
  }

  /* One fetch when the socket opens — and again after a reconnect — is all the
     stage needs now; every later change is pushed as `stage:update`. */
  async function loadStage() {
    const data = await api('GET', '/api/stage/state');
    if (data && data.ok) { stage = data; stageAt = Date.now(); renderScreens(); }
  }

  let ws = null;
  let retry = 0;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + (TOKEN ? '/?token=' + encodeURIComponent(TOKEN) : '/'));

    /* Versions are re-read on every open, not only at load: a translation
       imported in the app while this page sat in a pocket should appear. */
    ws.onopen = () => { retry = 0; setConnected(true); loadStatus(); loadStage(); loadVersions(); };

    ws.onmessage = (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }
      /* Stage has its own message type. It must be handled before the display
         branch, whose "looks like state" test a stage summary would fail. */
      /* The armed End window is shared with the desk, so both buttons agree. */
      if (msg && msg.type === 'endArm') { paintEndArm(Boolean(msg.armed)); return; }
      if (msg && msg.type === 'stage:update') {
        if (msg.state) { stage = msg.state; stageAt = Date.now(); renderScreens(); }
        return;
      }
      const state = msg && msg.type === 'display:update' ? msg.state : (msg && msg.state ? msg.state : msg);
      if (!state || typeof state !== 'object') return;
      if (state.scene !== undefined || state.blackout !== undefined) {
        live = state;
        afterProgramChange();
      }
    };

    ws.onclose = () => {
      setConnected(false);
      retry = Math.min(retry + 1, 6);
      setTimeout(connect, 600 * retry);
    };
    ws.onerror = () => { try { ws.close(); } catch { /* already closing */ } };
  }

  /* ── wiring ───────────────────────────────────────────── */

  $('go').addEventListener('click', () => { setTab('bible'); search(qEl.value); });
  qEl.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    qEl.blur();
    setTab('bible');
    search(qEl.value);
  });
  prevBtn.addEventListener('click', () => step('previous'));
  nextBtn.addEventListener('click', () => step('next'));
  $('version').addEventListener('change', versionChanged);
  Array.prototype.forEach.call($('modes').children, (btn) => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  $('toolBooks').addEventListener('click', () => { if (booksOpen) closeBrowser(); else void openBrowser(); });
  $('toolStrongs').addEventListener('click', toggleStrongs);
  $('toolFx').addEventListener('click', toggleFx);
  $('browseBack').addEventListener('click', browserBack);
  Array.prototype.forEach.call($('dualToggle').children, (btn) => {
    btn.addEventListener('click', () => setDual(btn.dataset.dual === 'dual'));
  });
  Array.prototype.forEach.call($('dualLayouts').children, (btn) => {
    btn.addEventListener('click', () => setDualLayout(btn.dataset.layout));
  });
  $('dualVersion').addEventListener('change', () => { opts.dualVersion = $('dualVersion').value; saveBibleOptions(); });
  $('fxType').addEventListener('change', () => {
    opts.fxType = $('fxType').value;
    saveBibleOptions();
    paintFx();
    sendFx({ transitionType: opts.fxType });
  });
  $('fxDuration').addEventListener('change', () => {
    opts.fxDuration = Number($('fxDuration').value) || 0.4;
    saveBibleOptions();
    paintFx();
    sendFx({ duration: opts.fxDuration });
  });
  $('fxBackground').addEventListener('click', () => sendFx({ animateBackground: !appFx().animateBackground }));
  $('fxStage').addEventListener('click', () => sendFx({ stageDisplayFxEnabled: !appFx().stageDisplayFxEnabled }));
  /* Two taps, because this is a phone and a thumb brushing a Clear would cost
     the next operator the service's references. The second tap has to come
     within three seconds, which is long enough to be deliberate and short
     enough that a stale "Sure?" is never sitting armed on a shared device. */
  function clearHistory(key, button, after) {
    clearTimeout(Number(button.dataset.timer) || 0);
    if (button.dataset.armed !== '1') {
      button.dataset.armed = '1';
      button.textContent = 'Sure?';
      const timer = setTimeout(() => {
        button.dataset.armed = '';
        button.textContent = 'Clear';
      }, 3000);
      button.dataset.timer = String(timer);
      return;
    }
    button.dataset.armed = '';
    button.textContent = 'Clear';
    try { localStorage.removeItem(key); } catch { /* storage off */ }
    after();
  }

  $('clearRecents').addEventListener('click', () => clearHistory(RECENT_KEY, $('clearRecents'), () => {
    paintRecents([]);
    toast('Recent references cleared');
  }));
  $('clearStudied').addEventListener('click', () => clearHistory(STUDY_KEY, $('clearStudied'), () => {
    paintStudied();
    toast('Studied numbers cleared');
  }));

  /* Closing the study puts back the verse the number came from — the same
     gesture as tapping the lit number, so there is one way to clear it. */
  $('studyClose').addEventListener('click', () => {
    const code = liveStudyCode();
    if (code) toggleStudy(code, lastVerse);
  });
  blackoutBtn.addEventListener('click', toggleBlackout);
  clearBtn.addEventListener('click', clearScreen);
  $('renameForm').addEventListener('submit', renameSession);
  /* A name typed but not yet submitted survives a status poll. */
  $('sessionNameInput').addEventListener('input', (event) => { event.target.dataset.dirty = '1'; });
  $('sessionStart').addEventListener('click', startSession);
  $('sessionEnd').addEventListener('click', endSession);
  $('ndiStart').addEventListener('click', startNdi);
  $('ndiStop').addEventListener('click', stopNdi);

  Array.prototype.forEach.call($('tabs').children, (btn) => {
    btn.addEventListener('click', () => setTab(btn.dataset.tab));
  });

  paintRecents();
  paintStudied();
  loadVersions();

  if (!TOKEN) {
    banner('This link is missing its key', 'Open the QR code in Settings → Output and scan it again.');
  }

  trackScroll();
  renderScreens();
  paintModes();
  paintTools();
  paintToolOptions();
  setConnected(false);
  connect();

  /* NDI consumers and session state change without a display update, so poll
     while the page is on screen — never in the background. Stage is not polled:
     it is pushed. */
  setInterval(() => {
    if (document.visibilityState === 'visible') loadStatus();
  }, 5000);

  /* The stage clock between pushes: rewrite just that line of text, so the
     strip is not rebuilt once a second. */
  function refreshStageClock() {
    if (!stage || !stage.open) return;
    const el = document.querySelector('.scr.stage .clock');
    const next = clock(stageSeconds());
    if (el && el.textContent !== next) el.textContent = next;
  }

  setInterval(() => {
    if (document.visibilityState === 'visible') refreshStageClock();
  }, 1000);

  /* A backgrounded page has its timers throttled, so a phone that comes back
     to the foreground would otherwise show a stale clock until the next push.
     The value is derived from the receipt time, so recomputing is enough. */
  document.addEventListener('visibilitychange', refreshStageClock);
})();
</script>
</body>
</html>
