<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://localhost:* http://127.0.0.1:*; media-src 'self' blob: http://localhost:* http://127.0.0.1:*; connect-src 'self' ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*; font-src 'self' data: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BSP Remote</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0c12;--surface:#141820;--surface2:#1c2130;--accent:#C9A96E;--text:#e8e8ed;--dim:#7a7a8a;--radius:12px}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
body{padding:16px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:18px;font-weight:700;color:var(--accent)}
.conn{font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(76,175,80,.15);color:#4caf50}
.conn.disconnected{background:rgba(244,67,54,.15);color:#f44336}
input,select,button{font-family:inherit;font-size:14px;border:none;outline:none;border-radius:var(--radius)}
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-row input{flex:1;padding:10px 14px;background:var(--surface2);color:var(--text);border:1px solid transparent}
.search-row input:focus{border-color:var(--accent)}
.search-row button{padding:10px 16px;background:var(--accent);color:#000;font-weight:600;cursor:pointer}
.quick-refs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.quick-refs button{padding:6px 12px;background:var(--surface);color:var(--dim);font-size:12px;cursor:pointer;border:1px solid rgba(255,255,255,.06)}
.quick-refs button:active{background:var(--surface2);color:var(--text)}
.result-card{padding:12px;background:var(--surface);border-radius:var(--radius);margin-bottom:10px;cursor:pointer;border:1px solid transparent}
.result-card:active{border-color:var(--accent);background:var(--surface2)}
.result-card .ref{color:var(--accent);font-weight:600;font-size:13px;margin-bottom:4px}
.result-card .text{color:var(--dim);font-size:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.result-card .text.expanded{-webkit-line-clamp:unset}
.mode-bar{display:flex;gap:8px;margin-bottom:14px}
.mode-bar button{flex:1;padding:8px;text-align:center;font-size:12px;background:var(--surface);color:var(--dim);cursor:pointer}
.mode-bar button.active{background:var(--accent);color:#000;font-weight:600}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px}
.scroll-area::-webkit-scrollbar{width:3px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:999px}
.actions{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:var(--bg);display:flex;gap:8px;border-top:1px solid rgba(255,255,255,.04);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.actions button{flex:1;padding:12px;font-size:13px;font-weight:600;cursor:pointer}
.btn-blackout{background:#f44336;color:#fff}
.btn-clear{background:var(--surface2);color:var(--dim)}
.btn-project{background:var(--accent);color:#000}
@media(prefers-color-scheme:light){:root{--bg:#f5f5f7;--surface:#fff;--surface2:#e8e8ed;--text:#1d1d1f;--dim:#86868b}}
</style>
</head>
<body>
<header>
<h1>BSP Remote</h1>
<span class="conn" id="connStatus">Connecting...</span>
</header>

<div class="search-row">
<input id="searchInput" type="text" placeholder="John 3:16 or search verses..." autocomplete="off" enterkeyhint="search">
<button id="searchBtn">Search</button>
</div>

<div class="quick-refs" id="quickRefs"></div>

<div class="mode-bar">
<button data-mode="bible" class="active">Bible</button>
<button data-mode="song">Song</button>
<button data-mode="media">Media</button>
</div>

<div class="scroll-area" id="results"></div>

<div class="actions">
<button class="btn-blackout" id="blackoutBtn">Blackout</button>
<button class="btn-clear" id="clearBtn">Clear</button>
<button class="btn-project" id="projectBtn">Project</button>
</div>

<script>
(function() {
  const API_BASE = window.location.origin;
  let ws = null;
  let currentMode = 'bible';
  let selectedVerse = null;
  let currentState = {};

  const $ = (id) => document.getElementById(id);
  const searchInput = $('searchInput');
  const searchBtn = $('searchBtn');
  const results = $('results');
  const connStatus = $('connStatus');
  const blackoutBtn = $('blackoutBtn');
  const clearBtn = $('clearBtn');
  const projectBtn = $('projectBtn');
  const quickRefs = $('quickRefs');

  const QUICK_REFS = ['John 3:16', 'Psalm 23', 'Romans 8:28', '1 Cor 13:4', 'Phil 4:13', 'Jer 29:11', 'Prov 3:5', 'Isa 40:31', 'Eph 2:8', 'Gen 1:1'];

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host);
    ws.onopen = () => { connStatus.textContent = 'Connected'; connStatus.className = 'conn'; };
    ws.onmessage = (e) => {
      try { currentState = JSON.parse(e.data); } catch {}
    };
    ws.onclose = () => {
      connStatus.textContent = 'Disconnected'; connStatus.className = 'conn disconnected';
      setTimeout(connectWS, 2000);
    };
  }

  async function api(method, path, body) {
    try {
      const opts = { method, headers: {} };
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const res = await fetch(API_BASE + path, opts);
      return await res.json();
    } catch { return { ok: false }; }
  }

  function showResults(data) {
    results.innerHTML = '';
    if (!data || !data.length) {
      results.innerHTML = '<div style="color:var(--dim);text-align:center;padding:40px;font-size:13px">No results. Search or tap a quick reference.</div>';
      return;
    }
    data.forEach((verse) => {
      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `<div class="ref">${verse.reference}</div><div class="text">${verse.text}</div>`;
      card.onclick = () => {
        selectedVerse = verse;
        document.querySelectorAll('.result-card').forEach((c) => c.style.borderColor = 'transparent');
        card.style.borderColor = 'var(--accent)';
        const textEl = card.querySelector('.text');
        textEl.classList.toggle('expanded');
      };
      results.appendChild(card);
    });
  }

  async function search(query) {
    if (!query.trim()) return;
    const data = await api('POST', '/api/verse/search', { query: query.trim(), versionId: 'KJV', limit: 20 });
    showResults(data.results || []);
  }

  async function projectVerse() {
    if (!selectedVerse) return;
    await api('POST', '/api/display/project', { verse: selectedVerse });
  }

  // Quick refs
  QUICK_REFS.forEach((ref) => {
    const btn = document.createElement('button');
    btn.textContent = ref;
    btn.onclick = () => { searchInput.value = ref; search(ref); };
    quickRefs.appendChild(btn);
  });

  // Events
  searchBtn.onclick = () => search(searchInput.value);
  searchInput.onkeydown = (e) => { if (e.key === 'Enter') search(searchInput.value); };

  projectBtn.onclick = projectVerse;
  clearBtn.onclick = () => api('POST', '/api/display/clear');
  blackoutBtn.onclick = () => api('POST', '/api/display/blackout');

  document.querySelectorAll('.mode-bar button').forEach((btn) => {
    btn.onclick = () => {
      document.querySelectorAll('.mode-bar button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
    };
  });

  // Load initial
  api('POST', '/api/verse/search', { query: 'John 3:16', versionId: 'KJV', limit: 5 }).then(showResults);

  connectWS();
})();
</script>
</body>
</html>
