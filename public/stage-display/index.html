<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Bible Song Pro — Stage Display</title>
    <link rel="stylesheet" href="stage-display.css" />
  </head>
  <body>
    <main class="stage-display mode-confidence" id="stage-display">
      <section class="program-surface" id="stage-program-surface" aria-label="Program preview">
        <iframe
          id="stage-program-frame"
          title="Embedded Bible Song Pro program output"
          src="http://localhost:8942/display.html?embedded=1"
        ></iframe>
        <div class="program-loading" id="stage-program-loading">Connecting to program preview…</div>
      </section>
      <section class="stage-stage" id="stage-stage" aria-label="Confidence content">
        <div class="stage-bg" id="stage-bg"></div>
        <div class="stage-zones" id="stage-zones"></div>
        <div class="stage-idle" id="stage-idle">
          <div class="idle-ring">
            <div class="idle-dot"></div>
          </div>
          <p class="idle-label">Stage Ready</p>
        </div>
        <footer class="stage-watermark" id="stage-watermark">
          <span class="watermark-left" id="stage-watermark-left">Bible Song Pro</span>
          <span class="watermark-right" id="stage-watermark-right"
            ><button type="button" class="watermark-settings" id="stage-settings-btn">Settings</button> · L = layout · Esc = clear</span
          >
        </footer>
      </section>
      <div class="stage-fallback" id="stage-fallback" role="alert" hidden></div>
      <div class="stage-picker" id="stage-picker" aria-hidden="true"></div>
      <div class="stage-context-menu" id="stage-context-menu" hidden></div>
    </main>

    <script>
      (function() {
        var CHANNEL_NAME = 'bsp-display-sync';
        var channel = new BroadcastChannel(CHANNEL_NAME);
        var stateHandler = null;

        window.BSPDesktop = {
          listStageLayouts: function() {
            try {
              var data = localStorage.getItem('bsp-stage-layouts');
              if (data) {
                var parsed = JSON.parse(data);
                return parsed && Array.isArray(parsed.layouts) ? parsed.layouts : [];
              }
            } catch (_e) {}
            return [];
          },
          saveStageLayout: function(layout) {
            try {
              var store = JSON.parse(localStorage.getItem('bsp-stage-layouts') || '{}');
              if (!store.layouts) store.layouts = [];
              var idx = store.layouts.findIndex(function(l) { return l.id === layout.id; });
              if (idx >= 0) store.layouts[idx] = layout;
              else store.layouts.push(layout);
              localStorage.setItem('bsp-stage-layouts', JSON.stringify(store));
            } catch (_e) {}
          },
          onStageDisplayState: function(handler) {
            stateHandler = handler;
          },
          sendStageDisplayState: function(payload) {
            channel.postMessage({ __bspStageDisplayState: true, payload: payload });
          },
        };

        channel.addEventListener('message', function(event) {
          var data = event.data;
          if (!data || !stateHandler) return;
          if (data.__bspDisplayState || data.__bspStageDisplayState) {
            stateHandler(data.payload);
          }
        });

        setTimeout(function() {
          if (window.BSPDesktop && window.BSPDesktop.sendStageDisplayState) {
            window.BSPDesktop.sendStageDisplayState({ kind: 'renderer-ready', atMs: Date.now() });
          }
        }, 200);
      })();
    </script>
    <script>
      /* When loaded inside the operator dock panel, strip the HUD chrome so the
         settings/watermark footer stays off the preview iframe. The standalone
         stage window (no embeddedPreview param) is unaffected. */
      (function() {
        if (new URLSearchParams(window.location.search).get('embeddedPreview') === '1') {
          var el = document.getElementById('stage-display');
          if (el) el.classList.add('embedded');
        }
      })();
    </script>
    <script src="stage-display.js"></script>
    <script>
      (function() {
        var settingsBtn = document.getElementById('stage-settings-btn');
        var rightWatermark = document.getElementById('stage-watermark-right');
        if (settingsBtn && rightWatermark) {
          rightWatermark.hidden = false;
          settingsBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (window.__BSP_STAGE_DISPLAY_TEST__ && window.__BSP_STAGE_DISPLAY_TEST__.togglePicker) {
              window.__BSP_STAGE_DISPLAY_TEST__.togglePicker();
            }
          });
        }
      })();
    </script>
  </body>
</html>
